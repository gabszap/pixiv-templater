name: Dev/Beta Production Release

on:
  push:
    paths:
      - 'manifest.json'
    branches:
      - dev
  workflow_dispatch:
    inputs:
      beta_version:
        description: 'Beta version suffix (e.g., 1 for v1.2.0-beta.1)'
        required: true
        default: '1'
      release_notes:
        description: 'Release notes for this beta version'
        required: false
        default: 'Beta release with latest features and fixes from dev branch.'

jobs:
  beta-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Get base version and create beta tag
        id: version
        run: |
          # Get raw version from manifest
          RAW_VERSION=$(jq -r '.version' manifest.json)
          echo "Raw version from manifest: $RAW_VERSION"
          
          # Extract base version (remove any existing -beta.X suffix)
          # If version is "2.1.5-beta.3", extract "2.1.5"
          # If version is "2.1.5", keep "2.1.5"
          if [[ "$RAW_VERSION" =~ ^(.+)-beta\. ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            echo "Detected existing beta suffix, extracted base: $BASE_VERSION"
          else
            BASE_VERSION="$RAW_VERSION"
            echo "No beta suffix found, using full version: $BASE_VERSION"
          fi
          
          # Determine beta version strings
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BETA_NUM="${{ github.event.inputs.beta_version }}"
          else
            # Fetch tags to find the latest beta for this base version
            git fetch --tags
            LATEST_BETA=$(git tag -l "v${BASE_VERSION}-beta.*" | sort -V | tail -n 1)
            
            if [ -z "$LATEST_BETA" ]; then
              # Default to 1 if no beta exists for this ver yet
              BETA_NUM="1"
            else
              # Extract the number from vX.Y.Z-beta.N
              CURRENT_NUM=$(echo $LATEST_BETA | sed -E 's/.*-beta\.([0-9]+)$/\1/')
              BETA_NUM=$((CURRENT_NUM + 1))
            fi
          fi
          
          # This is the string label e.g. 2.1.5-beta.123
          BETA_NAME="${BASE_VERSION}-beta.${BETA_NUM}"
          # This is the numeric only version for the manifest e.g. 2.1.5.123
          BETA_NUMERIC="${BASE_VERSION}.${BETA_NUM}"

          echo "beta_name=$BETA_NAME" >> $GITHUB_OUTPUT
          echo "beta_numeric=$BETA_NUMERIC" >> $GITHUB_OUTPUT
          echo "Created beta version name: $BETA_NAME (numeric: $BETA_NUMERIC)"

      - name: Update manifest versions for beta
        run: |
          BETA_NAME="${{ steps.version.outputs.beta_name }}"
          BETA_NUMERIC="${{ steps.version.outputs.beta_numeric }}"
          
          # Update Firefox manifest (adds/updates version and version_name)
          jq --arg v "$BETA_NUMERIC" --arg vn "$BETA_NAME" '.version = $v | .version_name = $vn' manifest.json > tmp.json && mv tmp.json manifest.json
          
          # Update Chrome manifest
          jq --arg v "$BETA_NUMERIC" --arg vn "$BETA_NAME" '.version = $v | .version_name = $vn' manifest.chrome.json > tmp.json && mv tmp.json manifest.chrome.json
          
          echo "Updated manifests to version: $BETA_NUMERIC (name: $BETA_NAME)"

      - name: Lint extension
        run: npm run lint

      - name: Build Firefox (unsigned)
        run: npm run build-firefox

      - name: Build Chrome (unsigned)
        run: npm run build-chrome

      - name: List artifacts
        run: ls -la artifacts/

      - name: Rename artifacts with beta tag
        run: |
          BETA_NAME="${{ steps.version.outputs.beta_name }}"
          
          # Rename Firefox artifact to xpi extension
          mv artifacts/pixiv-templater-firefox.zip artifacts/pixiv-templater-firefox-${BETA_NAME}.zip
          
          # Rename Chrome artifact
          mv artifacts/pixiv-templater-chrome.zip artifacts/pixiv-templater-chrome-${BETA_NAME}.zip
          
          echo "Renamed artifacts:"
          ls -la artifacts/

      - name: Create Pre-Release
        run: |
          BETA_NAME="${{ steps.version.outputs.beta_name }}"
          
          # Get release notes
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            NOTES="${{ github.event.inputs.release_notes }}"
          else
            # Get only the last commit message for concise notes
            LAST_MSG=$(git log -1 --pretty=format:'- %s')
            NOTES="Beta release from dev branch.\n\nLatest change:\n${LAST_MSG}"
          fi
          
          # Create release notes file using echo -e to evaluate newlines
          echo -e "## 🧪 Beta Release ${BETA_NAME}\n\n![Downloads](https://img.shields.io/github/downloads/gabszap/pixiv-templater/v${BETA_NAME}/total?style=for-the-badge&logo=github&label=Downloads&color=green)\n\n${NOTES}\n\n---\n\n### ⚠️ Important Notes\n\n**This is a BETA version** and may contain:\n- Latest features but unstable\n- Known or unknown bugs\n- Incomplete functionality\n- Potential data loss\n\nFor a stable experience, use the [latest stable release](https://github.com/gabszap/pixiv-templater/releases/latest).\n\n---\n\n### Installation Instructions\n\n**Firefox:**\n1. Download the \".zip\" file (rename to .xpi if needed)\n2. Go to \`about:addons\`\n3. Click gear icon → \"Install Add-on From File...\"\n4. Note: You need to disable signature verification in Regular Firefox, readme has a guide on how to do it.\n\n**Chrome:**\n1. Download the .zip file and extract it\n2. Go to \`chrome://extensions/\`\n3. Enable \"Developer mode\"\n4. Click \"Load unpacked\" and select the extracted folder\n\n---\n\n### Auto-Update\n\n✅ **Firefox**: Auto-updates enabled - you'll receive notifications when new beta versions are released\n❌ **Chrome**: No auto-update - you'll need to manually download and reinstall new beta versions\n" > release_notes.md
          
          # Create the pre-release
          gh release create "v${BETA_NAME}" \
            ./artifacts/pixiv-templater-firefox-${BETA_NAME}.zip \
            ./artifacts/pixiv-templater-chrome-${BETA_NAME}.zip \
            --title "v${BETA_NAME} (Beta)" \
            --notes-file release_notes.md \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Beta updates.json
        run: |
          BETA_NAME="${{ steps.version.outputs.beta_name }}"
          BETA_NUMERIC="${{ steps.version.outputs.beta_numeric }}"
          mkdir -p dist-beta
          cat > dist-beta/updates-beta.json <<EOF
          {
            "addons": {
              "pixiv-templater@gabszap": {
                "updates": [
                  {
                    "version": "$BETA_NUMERIC",
                    "update_link": "https://github.com/gabszap/pixiv-templater/releases/download/v${BETA_NAME}/pixiv-templater-firefox-${BETA_NAME}.zip"
                  }
                ]
              }
            }
          }
          EOF

      - name: Deploy Beta Metadata to Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist-beta
          branch: gh-pages
          target-folder: .
          clean: false

      - name: Upload artifacts as backup
        uses: actions/upload-artifact@v4
        with:
          name: beta-artifacts-${{ steps.version.outputs.beta_name }}
          path: artifacts/*.zip
          retention-days: 30
